# promtool unit tests for the node capacity and health alerts.
#
#   make test    (or: promtool test rules tests/node-alerts.test.yaml)
#
# These check two things worth checking: that the threshold is where the
# summary claims it is, and that alerts joining two metrics on a label
# actually produce a result. A vector match that silently yields nothing is
# the classic way an alert stops existing without anyone noticing.

rule_files:
  - ../.rendered/node-alerts.yaml

evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------
  # Filesystem: 10% free is below the 15% threshold.
  # ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{node="node-1", fstype="ext4", mountpoint="/"}'
        values: "10x60"
      - series: 'node_filesystem_size_bytes{node="node-1", fstype="ext4", mountpoint="/"}'
        values: "100x60"

    alert_rule_test:
      - eval_time: 20m
        alertname: NodeFilesystemAlmostFull
        exp_alerts:
          - exp_labels:
              severity: warning
              node: node-1
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Node node-1 root filesystem has less than 15% free (10% available)."
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodefilesystemalmostoutofspace/

  # ---------------------------------------------------------------------
  # 20% free is above the threshold, and tmpfs is excluded entirely — a
  # full tmpfs is normal and paging on it trains people to ignore the alert.
  # ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{node="node-1", fstype="ext4", mountpoint="/"}'
        values: "20x60"
      - series: 'node_filesystem_size_bytes{node="node-1", fstype="ext4", mountpoint="/"}'
        values: "100x60"
      - series: 'node_filesystem_avail_bytes{node="node-1", fstype="tmpfs", mountpoint="/"}'
        values: "1x60"
      - series: 'node_filesystem_size_bytes{node="node-1", fstype="tmpfs", mountpoint="/"}'
        values: "100x60"

    alert_rule_test:
      - eval_time: 20m
        alertname: NodeFilesystemAlmostFull
        exp_alerts: []

  # ---------------------------------------------------------------------
  # Memory: 3% available is below the 5% threshold.
  # ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{node="node-2"}'
        values: "3x30"
      - series: 'node_memory_MemTotal_bytes{node="node-2"}'
        values: "100x30"

    alert_rule_test:
      - eval_time: 15m
        alertname: NodeMemoryPressure
        exp_alerts:
          - exp_labels:
              severity: critical
              node: node-2
            exp_annotations:
              summary: "Node node-2 has less than 5% memory available (3%)."

      # `for: 10m` means a brief dip does not page. At 5 minutes the alert is
      # pending, not firing.
      - eval_time: 5m
        alertname: NodeMemoryPressure
        exp_alerts: []

  # ---------------------------------------------------------------------
  # CPU: idle time of 5% means 95% saturation, past the 90% threshold.
  # ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{node="node-3", cpu="0", mode="idle"}'
        values: "0+3x60"
      - series: 'node_cpu_seconds_total{node="node-3", cpu="1", mode="idle"}'
        values: "0+3x60"

    alert_rule_test:
      - eval_time: 45m
        alertname: NodeHighCPUSaturation
        exp_alerts:
          - exp_labels:
              severity: warning
              node: node-3
            exp_annotations:
              summary: "Node node-3 CPU usage above 90% for 30 minutes (95%)."

  # ---------------------------------------------------------------------
  # An idle node must not alert.
  # ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{node="node-3", cpu="0", mode="idle"}'
        values: "0+55x60"

    alert_rule_test:
      - eval_time: 45m
        alertname: NodeHighCPUSaturation
        exp_alerts: []

  # ---------------------------------------------------------------------
  # Node health: Ready=false.
  # ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'kube_node_status_condition{node="node-4", condition="Ready", status="true"}'
        values: "0x30"

    alert_rule_test:
      - eval_time: 10m
        alertname: NodeNotReady
        exp_alerts:
          - exp_labels:
              severity: critical
              node: node-4
              condition: Ready
              status: "true"
            exp_annotations:
              summary: "Node node-4 has been NotReady for more than 5 minutes."
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubenodenotready/

  # ---------------------------------------------------------------------
  # A cordoned node is fine for a while; four hours later it is a node
  # somebody forgot to uncordon after maintenance.
  # ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'kube_node_spec_unschedulable{node="node-5"}'
        values: "1x300"

    alert_rule_test:
      - eval_time: 2h
        alertname: NodeUnschedulableTooLong
        exp_alerts: []
      - eval_time: 4h30m
        alertname: NodeUnschedulableTooLong
        exp_alerts:
          - exp_labels:
              severity: warning
              node: node-5
            exp_annotations:
              summary: "Node node-5 has been cordoned for more than 4 hours — forgotten after maintenance?"

  # ---------------------------------------------------------------------
  # Pod capacity. This alert joins two metrics from different exporters on
  # the node label; if either side lacks it, the match yields nothing and
  # the alert quietly stops existing. That is the case worth pinning down.
  # ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'kubelet_running_pods{node="node-6", instance="10.0.0.6:10250"}'
        values: "105x60"
      - series: 'kube_node_status_capacity{node="node-6", resource="pods", unit="integer"}'
        values: "110x60"

    alert_rule_test:
      - eval_time: 20m
        alertname: KubeletTooManyPods
        exp_alerts:
          - exp_labels:
              severity: warning
              node: node-6
            exp_annotations:
              summary: "Kubelet on node-6 is running at more than 90% of its pod capacity."

  # ---------------------------------------------------------------------
  # Half full: no alert.
  # ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'kubelet_running_pods{node="node-6", instance="10.0.0.6:10250"}'
        values: "55x60"
      - series: 'kube_node_status_capacity{node="node-6", resource="pods", unit="integer"}'
        values: "110x60"

    alert_rule_test:
      - eval_time: 20m
        alertname: KubeletTooManyPods
        exp_alerts: []

  # ---------------------------------------------------------------------
  # Clock skew: 80ms and drifting further away. The `deriv` half of the
  # expression is what stops a node that is already correcting itself from
  # paging anyone.
  # ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'node_timex_offset_seconds{node="node-7"}'
        values: "0.06+0.002x30"

    alert_rule_test:
      - eval_time: 15m
        alertname: NodeClockSkewDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              node: node-7
            exp_annotations:
              summary: "Clock on node node-7 is out of sync by more than 50ms and not converging."

  # ---------------------------------------------------------------------
  # Skewed but converging: the offset is above the threshold yet shrinking,
  # so ntp is already fixing it and nobody needs to be told.
  # ---------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'node_timex_offset_seconds{node="node-7"}'
        values: "0.30-0.005x30"

    alert_rule_test:
      - eval_time: 15m
        alertname: NodeClockSkewDetected
        exp_alerts: []
